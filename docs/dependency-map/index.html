* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
code, .mono { font-family: var(--mono); font-size: .92em; }
a { color: inherit; }

.controls input[type=search] { font: inherit; font-family: var(--mono); padding: 5px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--ink); width: 16rem; max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .88rem; }

.sw { width: 14px; height: 12px; border-radius: 3px; border: 1.5px solid; display: inline-block; }
.ln { width: 20px; border-top: 2px solid; display: inline-block; }
.ln.dash { border-top-style: dashed; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .main { grid-template-columns: minmax(0, 1fr); } }
.map { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: auto; }
svg { display: block; }
.band { fill: var(--band); }
.rowlabel { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.edge { fill: none; stroke: var(--edge); opacity: .5; }
.edge.deferred { stroke-dasharray: 4 3; }
.edge.bad { stroke: var(--bad); opacity: .9; }
.edge.out { stroke: var(--out); opacity: 1; }
.edge.in { stroke: var(--in); opacity: 1; }
.edge.dim { opacity: .06; }
.node rect { stroke-width: 1.4; rx: 4; }
.node text { font-family: var(--mono); font-size: 11.5px; fill: var(--ink); pointer-events: none; }
.node { cursor: pointer; outline: none; }
.node.dim { opacity: .25; }
.node.sel rect { stroke-width: 3; }
.node:focus-visible rect { stroke-width: 3; stroke-dasharray: 3 2; }
aside { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; display: grid; gap: 12px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
aside h2 { margin: 0; font-size: 1.05rem; font-family: var(--mono); word-break: break-all; }
aside h3 { margin: 0 0 4px; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.kind { color: var(--muted); font-size: .88rem; }
.doc { margin: 0; }
.role { margin: 0; color: var(--muted); font-size: .92rem; border-left: 3px solid var(--rule); padding-left: 8px; }
.stats { display: flex; gap: 16px; color: var(--muted); }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); margin: 0; font-size: .92rem; }
.out-h { color: var(--out); } .in-h { color: var(--in); } .bad-h { color: var(--bad); }
ul { list-style: none; margin: 0; padding: 0; }
details.dep { border-top: 1px solid var(--rule); }
details.dep:first-of-type { border-top: none; }
details.dep summary { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; cursor: pointer; list-style: none; }
details.dep summary::-webkit-details-marker { display: none; }
details.dep summary::before { content: "▸"; color: var(--muted); font-size: .8em; }
details.dep[open] summary::before { content: "▾"; }
.go { font: inherit; font-family: var(--mono); font-size: .9em; background: none; border: none; color: inherit; padding: 0; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; text-align: left; word-break: break-all; }
.n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85em; }
.tag { font-size: .75em; padding: 0 5px; border-radius: 3px; border: 1px solid var(--rule); color: var(--muted); }
.tag.bad { color: var(--bad); border-color: var(--bad); }
.sites { padding: 2px 0 6px 16px; display: grid; gap: 2px; font-family: var(--mono); font-size: .8rem; }
.sites a { color: var(--muted); text-decoration: none; }
.sites a:hover { color: var(--ink); text-decoration: underline; }
.files li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; padding: 3px 0; border-top: 1px solid var(--rule); }
.files li:first-child { border-top: none; }
.files a { font-family: var(--mono); font-size: .82rem; word-break: break-all; }
.files .lines { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.files .fdoc { grid-column: 1 / -1; color: var(--muted); font-size: .82rem; }
.findings li { padding: 3px 0; font-family: var(--mono); font-size: .82rem; }
</style>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("map-data").textContent);
// Source links are relative to this page, which sits two levels under the repository root.
const SRC = "../../";

// Rule breaks (edge.bad) and cycles are found by generate.py, from ARCHITECTURE.md.
const RANK_NAMES = {
  11: "front-ends", 10: "session", 9: "agent_core", 8: "query_engine", 7: "prompt",
  6: "extensions · integration", 5: "tool_execution", 4: "guardrails", 3: "core",
  2: "context", 1: "tools · llm", 0: "config · protocol",
};
const units = Object.fromEntries(DATA.units.map(u => [u.id, u]));
const areaOf = id => units[id]?.area;
const CYCLES = DATA.cycles, LOCAL_CYCLES = DATA.local_cycles;
const inCycle = new Set(CYCLES.flat());

// ── groups and labels ───────────────────────────────────────────────────────
const GROUPS = {
  front:   { label: "Front-ends and measurement", fill: "--g-front", stroke: "--b-front" },
  engine:  { label: "Conversation and engine (ranks 6–10)", fill: "--g-engine", stroke: "--b-engine" },
  gov:     { label: "Guardrails and execution (4–5)", fill: "--g-gov", stroke: "--b-gov" },
  found:   { label: "Contracts and foundations (0–3)", fill: "--g-found", stroke: "--b-found" },
  servers: { label: "MCP servers", fill: "--g-servers", stroke: "--b-servers" },
  shared:  { label: "shared", fill: "--g-shared", stroke: "--b-shared" },
};
const groupOf = id => {
  const u = units[id];
  if (u.area === "servers" || u.area === "shared") return u.area;
  if (u.rank >= 11) return "front";
  if (u.rank >= 6) return "engine";
  if (u.rank >= 4) return "gov";
  return "found";
};
const short = id => id.replace(/^(client|servers|shared)\./, "");
// A sub-package is named by its leaf on the map; its parent sits beside it in the row.
const label = id => {
  const s = short(id);
  if (/^(guardrails|query_engine)\./.test(s)) return s.split(".").pop();
  if (/^ui\.ws\./.test(s)) return "ws." + s.split(".").pop();
  return s;
};
const kindOf = u => u.area === "client" ? `client · rank ${u.rank}`
  : u.area === "measure" ? "measurement · drives the agent"
  : u.area === "servers" ? "MCP server package"
  : `shared · ${u.role === "contract" ? "client ↔ servers contract" : u.role === "servers" ? "servers only" : "not listed in ARCHITECTURE.md"}`;

// ── layout ──────────────────────────────────────────────────────────────────
// Client units in one row per rank, top to bottom; servers in a column on the right;
// shared below, one band per reader. Boxes are as wide as their label and never overlap.
const LEFT = 150, ROW_H = 54, NODE_H = 26, GAP = 12, CHAR_W = 7.1, PAD = 18, SRV_GAP = 60;
const boxW = id => Math.max(54, Math.ceil(label(id).length * CHAR_W) + PAD);
const rowW = ids => ids.reduce((s, id) => s + boxW(id), 0) + GAP * Math.max(0, ids.length - 1);
const ranked = DATA.units.filter(u => u.area === "client" || u.area === "measure");
const ranks = [...new Set(ranked.map(u => u.rank))].sort((a, b) => b - a);
const ROWS = ranks.map(r => ({ rank: r, ids: ranked.filter(u => u.rank === r).map(u => u.id) }));
const SERVERS = DATA.units.filter(u => u.area === "servers").map(u => u.id);
const SHARED_BANDS = [
  ["shared · client ↔ servers contract", "contract"],
  ["shared · servers only", "servers"],
  ["shared · not listed in ARCHITECTURE.md", "unlisted"],
].map(([name, role]) => ({ name, ids: DATA.units.filter(u => u.area === "shared" && u.role === role).map(u => u.id) }))
 .filter(b => b.ids.length);

const CLIENT_W = Math.max(...ROWS.map(r => rowW(r.ids)));
const pos = {};
ROWS.forEach((r, i) => {
  const y = 30 + i * ROW_H;
  let x = LEFT + (CLIENT_W - rowW(r.ids)) / 2;
  for (const id of r.ids) { pos[id] = { x, y, w: boxW(id), h: NODE_H }; x += boxW(id) + GAP; }
});
const SRV_X = LEFT + CLIENT_W + SRV_GAP;
const SRV_W = Math.max(...SERVERS.map(boxW));
SERVERS.forEach((id, i) => {
  const step = SERVERS.length > 1 ? (ROWS.length - 1) * ROW_H / (SERVERS.length - 1) : 0;
  pos[id] = { x: SRV_X, y: 30 + i * step, w: SRV_W, h: NODE_H };
});
const W = SRV_X + SRV_W + 24;
const bandHeads = [];
let y = 30 + ROWS.length * ROW_H + 34;
SHARED_BANDS.forEach((band, i) => {
  if (i > 0) y += 40 + 28;
  bandHeads.push(y);
  let x = LEFT;
  for (const id of band.ids) {
    if (x + boxW(id) > W - 24) { x = LEFT; y += 40; }
    pos[id] = { x, y, w: boxW(id), h: NODE_H };
    x += boxW(id) + GAP;
  }
});
const H = y + NODE_H + 24;

// ── drawing ─────────────────────────────────────────────────────────────────
const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent = svg) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e); return e;
};
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", W); svg.setAttribute("height", H);
ROWS.forEach((r, i) => {
  const ry = 30 + i * ROW_H;
  el("rect", { class: "band", x: 8, y: ry - 12, width: LEFT + CLIENT_W - 8, height: ROW_H - 6, rx: 4 });
  el("text", { class: "rowlabel", x: 14, y: ry + 10 }).textContent = `rank ${r.rank}`;
  el("text", { class: "rowlabel", x: 14, y: ry + 24 }).textContent = RANK_NAMES[r.rank] || "";
});
el("text", { class: "rowlabel", x: SRV_X, y: 14 }).textContent = "MCP servers";
SHARED_BANDS.forEach((b, i) => { el("text", { class: "rowlabel", x: 14, y: bandHeads[i] - 10 }).textContent = b.name; });

const edgeLayer = el("g"), nodeLayer = el("g");
const pathFor = (a, b) => {
  const pa = pos[a], pb = pos[b];
  const down = pb.y > pa.y + 2, up = pb.y < pa.y - 2;
  const sx = pa.x + pa.w / 2, tx = pb.x + pb.w / 2;
  if (!down && !up) { const mid = Math.min(pa.y, pb.y) - 20; return `M${sx},${pa.y} C${sx},${mid} ${tx},${mid} ${tx},${pb.y}`; }
  const sy = down ? pa.y + pa.h : pa.y, ty = down ? pb.y : pb.y + pb.h, dy = (ty - sy) / 2;
  return `M${sx},${sy} C${sx},${sy + dy} ${tx},${ty - dy} ${tx},${ty}`;
};
const edges = DATA.edges.filter(e => pos[e.from] && pos[e.to]).map(e => ({
  ...e,
  el: el("path", {
    class: "edge" + (e.load ? "" : " deferred") + (e.bad ? " bad" : ""),
    d: pathFor(e.from, e.to), "stroke-width": Math.min(1 + Math.log2(e.n + 1), 4.5),
  }, edgeLayer),
}));
const nodes = {};
for (const u of DATA.units) {
  const p = pos[u.id]; if (!p) continue;
  const g = GROUPS[groupOf(u.id)];
  const gEl = el("g", { class: "node", tabindex: 0, role: "button", "aria-label": u.id }, nodeLayer);
  el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, fill: `var(${g.fill})`, stroke: inCycle.has(u.id) ? "var(--bad)" : `var(${g.stroke})` }, gEl);
  el("text", { x: p.x + p.w / 2, y: p.y + p.h / 2 + 4, "text-anchor": "middle" }, gEl).textContent = label(u.id);
  el("title", {}, gEl).textContent = `${u.id} — ${u.lines.toLocaleString("en")} lines, ${u.files.length} file(s)${u.doc ? "\n" + u.doc : ""}`;
  gEl.addEventListener("click", ev => { ev.stopPropagation(); select(u.id); });
  gEl.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(u.id); } });
  gEl.addEventListener("mouseenter", () => { if (!selected) highlight(u.id); });
  gEl.addEventListener("mouseleave", () => { if (!selected) highlight(null); });
  nodes[u.id] = gEl;
}
svg.addEventListener("click", () => select(null));

// ── state ───────────────────────────────────────────────────────────────────
let selected = null;
const ctl = id => document.getElementById(id);
const visible = e => (ctl("deferred").checked || e.load)
  && (ctl("shared").checked || !(areaOf(e.to) === "shared" || areaOf(e.from) === "shared"))
  && (!ctl("onlybad").checked || e.bad);
function highlight(id) {
  const related = new Set(id ? [id] : []);
  for (const e of edges) {
    const on = visible(e);
    e.el.style.display = on ? "" : "none";
    e.el.classList.remove("out", "in", "dim");
    if (!id || !on) continue;
    if (e.from === id) { e.el.classList.add("out"); related.add(e.to); }
    else if (e.to === id) { e.el.classList.add("in"); related.add(e.from); }
    else e.el.classList.add("dim");
  }
  for (const [nid, g] of Object.entries(nodes)) {
    g.classList.toggle("dim", !!id && !related.has(nid));
    g.classList.toggle("sel", nid === id);
  }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const srcLink = (file, line) => `${SRC}${file}${line ? "#L" + line : ""}`;
const siteLine = s => `<a href="${esc(srcLink(s.file, s.line))}" title="${esc(s.file)}:${s.line}">`
  + `${esc(s.file.replace(/^mimir\//, ""))}:${s.line}</a> `
  + `<span>${s.names.length ? `from ${esc(s.module)} import ${esc(s.names.join(", "))}` : `import ${esc(s.module)}`}</span>`
  + (s.load ? "" : ` <span class="tag">deferred</span>`);
function depList(title, cls, list, other) {
  if (!list.length) return `<div><h3 class="${cls}">${title}</h3><p class="hint">None.</p></div>`;
  return `<div><h3 class="${cls}">${title} · ${list.length}</h3>${list.map(e => `
    <details class="dep"><summary>
      <button class="go" data-go="${esc(e[other])}">${esc(e[other])}</button>
      ${e.load ? "" : `<span class="tag">deferred</span>`}
      ${e.bad ? `<span class="tag bad" title="${esc(e.bad)}">rule</span>` : ""}
      <span class="n" title="import statements">${e.n}</span>
    </summary>
    ${e.bad ? `<p class="hint bad-h">${esc(e.bad)}</p>` : ""}
    <div class="sites">${e.sites.map(s => `<div>${siteLine(s)}</div>`).join("")}</div>
    </details>`).join("")}</div>`;
}
function overview() {
  const bad = DATA.edges.filter(e => e.bad);
  return `<h2>Pick a unit</h2>
    <p class="hint">Click a box (or Tab to it and press Enter). What it imports turns <span class="out-h">green</span>, what imports it <span class="in-h">blue</span>. Open a dependency to see every import statement, linked to its line.</p>
    <p class="hint">A unit is a client package (a sub-package for <code>guardrails</code>, <code>query_engine</code> and <code>ui</code>), a server package, or a module of <code>shared</code>. Solid edges run at load time, dashed ones inside a function only; imports under <code>TYPE_CHECKING</code> are not drawn. Ranks and roles come from ARCHITECTURE.md.</p>
    <div><h3 class="${bad.length ? "bad-h" : ""}">Rule breaks · ${bad.length}</h3>${bad.length
      ? `<ul class="findings">${bad.map(e => `<li><button class="go" data-go="${esc(e.from)}">${esc(e.from)}</button> → ${esc(e.to)} <span class="hint">${esc(e.bad)}</span></li>`).join("")}</ul>`
      : `<p class="hint">None: every edge keeps ARCHITECTURE.md's rules.</p>`}</div>
    <div><h3 class="${CYCLES.length ? "bad-h" : ""}">Load-time cycles across units · ${CYCLES.length}</h3>${CYCLES.length
      ? `<ul class="findings">${CYCLES.map(c => `<li>${c.map(id => `<button class="go" data-go="${esc(id)}">${esc(id)}</button>`).join(" ⇄ ")}</li>`).join("")}</ul>`
      : `<p class="hint">None.</p>`}</div>
    ${LOCAL_CYCLES.length ? `<div><h3>Cycles inside one unit · ${LOCAL_CYCLES.length}</h3>
      <p class="hint">A package and its own sub-packages importing each other: allowed, since ARCHITECTURE.md ranks them as one unit.</p>
      <ul class="findings">${LOCAL_CYCLES.map(c => `<li>${c.map(id => `<button class="go" data-go="${esc(id)}">${esc(id)}</button>`).join(" ⇄ ")}</li>`).join("")}</ul></div>` : ""}`;
}
const panel = ctl("panel");
function renderPanel(id) {
  if (!id) { panel.innerHTML = overview(); }
  else {
    const u = units[id];
    const out = edges.filter(e => e.from === id && visible(e)).sort((a, b) => b.n - a.n);
    const inn = edges.filter(e => e.to === id && visible(e)).sort((a, b) => b.n - a.n);
    const files = [...u.files].sort((a, b) => b.lines - a.lines);
    panel.innerHTML = `<div><h2>${esc(id)}</h2><div class="kind">${esc(kindOf(u))}${inCycle.has(id) ? ` · <span class="bad-h">in a load-time cycle</span>` : ""}</div></div>
      ${u.doc ? `<p class="doc">${esc(u.doc)}</p>` : ""}
      ${u.area === "client" && u.role ? `<p class="role" title="ARCHITECTURE.md, rank ${u.rank}">${esc(u.role)}</p>` : ""}
      <div class="stats"><span><b>${u.lines.toLocaleString("en")}</b> lines</span><span><b>${u.files.length}</b> file(s)</span>
        <span><b>${out.length}</b> out</span><span><b>${inn.length}</b> in</span></div>
      ${depList("Imports", "out-h", out, "to")}
      ${depList("Imported by", "in-h", inn, "from")}
      <div><h3>Files</h3><ul class="files">${files.map(f => `<li>
        <a href="${esc(srcLink(f.path))}">${esc(f.path.replace(/^mimir\//, ""))}</a><span class="lines">${f.lines}</span>
        ${f.doc ? `<span class="fdoc">${esc(f.doc)}</span>` : ""}</li>`).join("")}</ul></div>`;
  }
  panel.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", ev => {
    ev.preventDefault(); ev.stopPropagation(); select(b.dataset.go);
  }));
}
function select(id) {
  selected = id && units[id] ? id : null;
  highlight(selected); renderPanel(selected);
  // The selection is in the address, so a link can point a colleague at a unit.
  const hash = selected ? "#" + selected : "";
  if (location.hash !== hash) history.replaceState(null, "", hash || location.pathname + location.search);
  if (selected && nodes[selected]) nodes[selected].scrollIntoView?.({ block: "nearest", inline: "nearest" });
}
["deferred", "shared", "onlybad"].forEach(c => ctl(c).addEventListener("change", () => { highlight(selected); renderPanel(selected); }));
ctl("find").addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase();
  if (!q) return;
  const hit = DATA.units.find(u => u.id.toLowerCase() === q)
    || DATA.units.find(u => short(u.id).toLowerCase().startsWith(q))
    || DATA.units.find(u => u.id.toLowerCase().includes(q))
    || DATA.units.find(u => u.files.some(f => f.path.toLowerCase().includes(q)));
  if (hit) select(hit.id);
});
window.addEventListener("hashchange", () => select(decodeURIComponent(location.hash.slice(1))));

const load = DATA.edges.filter(e => e.load).length;
const sites = DATA.edges.reduce((s, e) => s + e.n, 0);
const lines = DATA.units.reduce((s, u) => s + u.lines, 0);
ctl("meta").textContent = `${DATA.units.length} units · ${lines.toLocaleString("en")} lines · ${load} load-time edges · ${DATA.edges.length - load} deferred-only · ${sites} import statements`;
const badCount = DATA.edges.filter(e => e.bad).length;
ctl("health").innerHTML = `<span class="pill ${badCount ? "bad" : "ok"}">${badCount} rule break${badCount === 1 ? "" : "s"}</span>`
  + `<span class="pill ${CYCLES.length ? "bad" : "ok"}">${CYCLES.length} cycle${CYCLES.length === 1 ? "" : "s"} across units</span>`;
ctl("legend").innerHTML = Object.values(GROUPS).map(g => `<span><i class="sw" style="background:var(${g.fill});border-color:var(${g.stroke})"></i>${g.label}</span>`).join("")
  + `<span><i class="ln" style="border-color:var(--edge)"></i>load time</span>`
  + `<span><i class="ln dash" style="border-color:var(--edge)"></i>deferred</span>`
  + `<span><i class="ln" style="border-color:var(--bad)"></i>breaks a rule</span>`;
select(decodeURIComponent(location.hash.slice(1)) || null);
</script>
</body>
</html>
