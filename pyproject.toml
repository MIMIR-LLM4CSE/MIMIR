[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir-agent"
version = "0.1.0"
description = "MIMIR — a local AI agent over MCP tool servers, from math to HPC."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MIMIR contributors" }]
keywords = ["llm", "agent", "mcp", "hpc", "ollama", "vllm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Intended Audience :: Science/Research",
]

# Core runtime — enough to start every server registered by default.
dependencies = [
    "mcp>=1.0.0,<2",
    "ollama>=0.3.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "sympy>=1.12",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# vLLM is used through its OpenAI-compatible API, so the client only needs the
# `openai` package (already in core). This extra exists so `pip install .[vllm]`
# stays a valid, documented command.
vllm = ["openai>=1.0.0"]

# Fine-tuning stack — only needed for the ml/ servers (server_finetune.py).
finetune = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "datasets>=2.18.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
]

# Development / test tooling.
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/MIMIR-LLM4CSE/MIMIR"
Documentation = "https://github.com/MIMIR-LLM4CSE/MIMIR/blob/master/README.md"
Source = "https://github.com/MIMIR-LLM4CSE/MIMIR"

[project.scripts]
mimir = "mimir.client.ui.cli.main:main_sync"
mimir-server = "mimir.client.ui.ws.ws_server:main"

[tool.setuptools]
# The MCP servers are launched as standalone scripts by absolute file path
# (SERVER_BASE in client/config/constants.py, resolved from __file__), so they
# must ship inside the installed package tree even though they are not importable
# sub-packages. include-package-data + the package-data globs below cover them.
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mimir*"]
# vscode-extension is a Node project, not a Python package; tests ship separately.
exclude = ["mimir.vscode-extension*", "mimir.tests*", "tests*", "slides*"]

[tool.setuptools.package-data]
mimir = [
    "requirements.txt",
    "servers/**/*.py",
    "servers/**/*.json",
    "skills/**/*.md",
    "client/config/*.json",
    "examples/*.md",
    "examples/**/*.py",
    "examples/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["mimir/tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Generated/vendored trees the linter has no say over.
extend-exclude = ["mimir/vscode-extension", "build", "slides"]

[tool.ruff.lint]
# Deliberately narrow: the rules that catch a defect, not the ones that impose a
# house style. E9/F are the ones that would have failed the file at import (a real
# `F821 undefined-name` sat in server_proxy's run aggregation until this was turned
# on); E4/E7 cover imports and the statement-level traps. Style-only families
# (import sorting, quoting, line breaks) are left off on purpose — enabling them
# would rewrite 200 files and bury the findings that matter under the churn.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The servers and their tests reach _shared/ and _lib/ by inserting onto sys.path,
# so their imports cannot sit at the top of the file (E402). Tests also line up
# short assertions with semicolons and group scaffolding imports (E702/E401), which
# reads better in a table of cases than one statement per line.
"mimir/tests/*" = ["E402", "E702", "E401"]
"mimir/client/ui/ws/_ws_runtime.py" = ["E402"]
